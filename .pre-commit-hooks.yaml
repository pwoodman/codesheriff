# The Code Sheriff pre-commit hooks.
# New repos: use the `sheriff-*` ids with `codesheriff`.
# Legacy `quality-*` ids are kept for backwards compatibility.
- id: sheriff-format
  name: The Code Sheriff (format)
  description: Check formatting with The Code Sheriff
  entry: codesheriff format --check
  language: python
  pass_filenames: false
  stages: [pre-commit]
- id: sheriff-lint
  name: The Code Sheriff (lint)
  description: Lint with The Code Sheriff
  entry: codesheriff lint
  language: python
  pass_filenames: false
  stages: [pre-commit]
- id: sheriff-version
  name: The Code Sheriff (version)
  description: Check version/changelog with The Code Sheriff
  entry: codesheriff version
  language: python
  pass_filenames: false
  stages: [pre-commit]
- id: sheriff-push
  name: The Code Sheriff (push gates)
  description: DRY, security, compile, impact, coverage, audit, and UI
  entry: codesheriff run --only dry,security,compile,impact,coverage,audit,ui
  language: python
  pass_filenames: false
  stages: [pre-push]
- id: quality-format
  name: The Code Sheriff (format, legacy alias)
  description: Deprecated alias for sheriff-format
  entry: codesheriff format --check
  language: python
  pass_filenames: false
  stages: [pre-commit]
- id: quality-lint
  name: The Code Sheriff (lint, legacy alias)
  description: Deprecated alias for sheriff-lint
  entry: codesheriff lint
  language: python
  pass_filenames: false
  stages: [pre-commit]
- id: quality-version
  name: The Code Sheriff (version, legacy alias)
  description: Deprecated alias for sheriff-version
  entry: codesheriff version
  language: python
  pass_filenames: false
  stages: [pre-commit]
- id: quality-push
  name: The Code Sheriff (push gates, legacy alias)
  description: Deprecated alias for sheriff-push
  entry: codesheriff run --only dry,security,compile,impact,coverage,audit,ui
  language: python
  pass_filenames: false
  stages: [pre-push]
