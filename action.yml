name: The Code Sheriff
description: Run The Code Sheriff gates on your change set
branding:
  icon: shield
  color: green
inputs:
  args:
    description: Arguments passed to codesheriff run
    required: false
    default: run
  version:
    description: PyPI version of codesheriff to install (empty = latest)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
    - run: |
        if [ -n "${{ inputs.version }}" ]; then
          pip install "codesheriff==${{ inputs.version }}"
        else
          pip install "codesheriff"
        fi
      shell: bash
    - run: codesheriff ${{ inputs.args }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
