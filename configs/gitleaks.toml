title = "gitleaks config"

[extend]
useDefault = true

[allowlist]
paths = [
  '''(^|/)tests/fixtures/''',
  '''(^|/)tests/test_redact\.py$''',
  '''(^|/)tests/test_guard_replay_risk\.py$''',
  '''(^|/)src/quality_gates/review/aacr_bench\.py$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)go\.sum$''',
  '''(^|/)configs/semgrep\.yml$''',
]
stopwords = [
  "example",
  "placeholder",
  "changeme",
  "your-secret-here",
]
